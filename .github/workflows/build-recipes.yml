name: Rebuild recipe pages

on:
  workflow_dispatch:
  schedule:
    - cron: '30 6 * * *'   # daily, after the morning price refresh

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/build-recipes.mjs
      - name: Commit if changed
        run: |
          git add recepten en/recipes sitemap.xml robots.txt
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git config user.name "youmechef-bot"
            git config user.email "hello@youmechef.com"
            git commit -m "Rebuild recipe pages

          Co-Authored-By: Claude Fable 5 <noreply@anthropic.com>"
            git push
          fi
