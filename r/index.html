<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Youmechef | Gedeeld recept</title>
<meta name="description" content="Een recept, gedeeld via Youmechef.">
<meta name="robots" content="noindex">
<meta property="og:title" content="Youmechef">
<meta property="og:description" content="Een recept, gedeeld via Youmechef.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://www.youmechef.com/assets/og.jpg">
<link rel="icon" href="/assets/favicon.png?v=2">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<header class="nav nav-light">
  <a class="brand" href="/">
    <img src="/assets/logo.png?v=2" alt="" width="36" height="36">
    <span>Youmechef</span>
  </a>
  <nav>
    <a href="/">Terug naar home</a>
  </nav>
</header>

<main class="recipe-page" id="shared">
  <p id="state" class="recipe-meta-line">Recept laden&hellip;</p>
</main>

<footer class="footer">
  <p>Youmechef</p>
  <p class="micro"><a href="/privacy/">Privacy</a> &middot; <a href="/voorwaarden/">Voorwaarden</a> &middot; <a href="/support/">Support</a></p>
  <p class="micro">&copy; <span id="year">2026</span> Youmechef. Alle rechten voorbehouden.</p>
</footer>

<script type="module">
  // One page for every /r/<code> address. The app makes the codes, this page
  // reads the one in the URL, fetches the recipe live, and renders it with
  // the same template the SEO pages are built from.
  import { recipeArticle } from '/scripts/recipe-template.mjs';

  document.getElementById('year').textContent = new Date().getFullYear();

  var main = document.getElementById('shared');

  function notFound() {
    document.title = 'Youmechef | Recept niet gevonden';
    main.innerHTML =
      '<p class="eyebrow">Gedeeld recept</p>' +
      '<h1>Recept niet gevonden</h1>' +
      '<p class="recipe-meta-line">Deze link klopt niet of het recept is niet meer gedeeld.<br><span lang="en">Recipe not found.</span></p>' +
      '<p style="margin-top: 24px;"><a class="btn" href="/">Terug naar home</a></p>';
  }

  function amount(i) {
    if (i.unit === 'piece') return i.quantity + 'x';
    return i.quantity + ' ' + i.unit;
  }

  var m = location.pathname.match(/^\/r\/([A-Za-z0-9_-]{12})\/?$/);
  if (!m) {
    notFound();
  } else {
    fetch('https://zendompobuoihmfxrfzc.supabase.co/rest/v1/rpc/shared_recipe', {
      method: 'POST',
      headers: {
        apikey: 'sb_publishable__sc02lAfmuJH_ngb0w9uQQ_pN3Lid7h',
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({ p_code: m[1] }),
    })
      .then(function (res) { return res.ok ? res.json() : null; })
      .then(function (r) {
        if (!r || !r.title) { notFound(); return; }
        document.title = r.title + ' | Youmechef';
        main.innerHTML = recipeArticle(
          {
            title: r.title,
            imageUrl: r.imageUrl,
            prepMinutes: r.prepMinutes,
            portions: r.portions,
            pricePerPortion: r.pricePerPortion,
            items: (r.ingredients || []).map(function (i) { return amount(i) + ' ' + String(i.name || '').toLowerCase(); }),
            sourceUrl: r.sourceUrl,
          },
          {
            lang: 'nl',
            eyebrow: 'Gedeeld recept',
            itemsHeading: 'Ingrediënten',
            ctaText: 'Zet me op de wachtlijst',
            ctaHref: '/#waitlist',
          }
        );
      })
      .catch(function () {
        document.getElementById('state').textContent = 'Dat lukte even niet. Probeer het nog een keer.';
      });
  }
</script>

</body>
</html>
